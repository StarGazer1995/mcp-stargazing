name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  dependency-chain:
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-chain-reusable.yml
    with:
      changed_repository: ${{ github.repository }}
      candidate_ref: ${{ github.sha }}
      baseline_ref: main
      refs_json: '{}'
      allow_known_baseline: false
      orchestrator_ref: ${{ github.sha }}

  build-and-publish:
    name: Build and Publish to PyPI
    needs: dependency-chain
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing to PyPI
      contents: write  # Required for creating GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release tag and main ancestry
        run: |
          VERSION=$(python .github/scripts/release_guard.py version)
          python .github/scripts/release_guard.py validate-tag --tag "$GITHUB_REF_NAME"
          git fetch --depth=1 origin main:refs/remotes/origin/main
          python .github/scripts/release_guard.py validate-ancestor --ancestor origin/main
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Refresh deep-sky catalog data
        run: |
          python -m pip install --upgrade pip
          pip install astroquery astropy numpy
          python scripts/download_data.py

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Validate built distribution versions
        run: python .github/scripts/release_guard.py validate-dist --version "$version"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
