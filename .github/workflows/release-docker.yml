name: Release Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  dependency-chain:
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-chain-reusable.yml
    with:
      changed_repository: ${{ github.repository }}
      candidate_ref: ${{ github.sha }}
      baseline_ref: main
      refs_json: '{}'
      allow_known_baseline: false
      orchestrator_ref: ${{ github.sha }}

  build-and-push:
    name: Build and Push Docker Image
    needs: dependency-chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required for pushing to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release tag and main ancestry
        run: |
          python .github/scripts/release_guard.py validate-tag --tag "$GITHUB_REF_NAME"
          git fetch --depth=1 origin main:refs/remotes/origin/main
          python .github/scripts/release_guard.py validate-ancestor --ancestor origin/main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: production
